<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Запись к мастеру</title>

<style>
:root{--bg:#fbf1ec;--ink:#2b2622;--muted:#8a7d75;--green:#2f6650;--panel:#fff;--line:#ecd9d0;
padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:18px 14px 130px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:30px;margin:6px 0 2px;color:var(--green)}
.sub{color:var(--muted);margin:0 0 18px}
h2{font-size:15px;margin:22px 0 8px}
.svc{display:flex;align-items:center;gap:12px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.svc.on{border-color:var(--green);background:#eef6f1}
.svc .n{flex:1;font-weight:600;font-size:15px}.svc .p{color:var(--muted);font-size:14px;white-space:nowrap}
.my{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}.my .n{flex:1;font-weight:600;font-size:15px}.my small{display:block;color:var(--muted);font-weight:400;font-size:13px;margin-top:2px}
.box{width:22px;height:22px;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;color:#fff;font-size:14px}
.on .box{background:var(--green);border-color:var(--green)}
.cal{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:16px}
.nav{width:38px;height:38px;border:0;border-radius:10px;background:var(--bg);font-size:24px;color:var(--green)}.nav:disabled{opacity:.3}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cg i{font-style:normal;font-size:12px;color:var(--muted);padding:4px 0}
.day{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-size:15px;border:0;background:transparent;color:var(--muted);opacity:.35;padding:0}
button.day{opacity:1;background:#eef6f1;color:var(--green);font-weight:700}
button.day.on{background:var(--green);color:#fff}
.day.today{box-shadow:inset 0 0 0 1.5px var(--green)}
.adm{width:100%;border:0;border-radius:12px;padding:13px;margin-bottom:14px;background:#2b2622;color:#fff;font-weight:700;font-size:15px}
#admv{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--bg);overflow:auto;z-index:5;padding-top:env(safe-area-inset-top,0px)}
.admw{max-width:520px;margin:0 auto;padding:18px 14px 40px}
.back{border:0;background:none;color:var(--green);font-size:15px;font-weight:700;padding:6px 0}
.ad{aspect-ratio:1;display:grid;place-items:center;position:relative;border:0;border-radius:10px;background:transparent;color:var(--ink);font-size:15px;padding:0}
.ad.has{background:#eef6f1;color:var(--green);font-weight:700}
.ad.bk::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:#e9967a}
.ad.on{background:var(--green);color:#fff}
.ad.today{box-shadow:inset 0 0 0 1.5px var(--green)}
small.fr{color:var(--green);font-weight:600}
.my a{color:var(--ink)}
.rbtns{display:flex;gap:8px;margin-top:12px}.rbtns button{flex:1;padding:12px;border:0;border-radius:10px;font-weight:700;font-size:15px}.go2{background:var(--green);color:#fff}.go2:disabled{background:#cdbfb7}.no{background:var(--bg);color:var(--ink)}
#rs .chip{margin:0 6px 6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 13px;font-size:14px;font-weight:600;color:var(--ink)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
input{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;margin-bottom:8px;background:var(--panel);color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.bar>div{max-width:520px;margin:0 auto}
#sum{font-size:13px;color:var(--muted);margin-bottom:6px;min-height:17px}
#go{width:100%;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:700;background:var(--green);color:#fff}
#go:disabled{background:#cdbfb7}
#err{color:#c0392b;font-size:14px;margin-top:8px}
.done{text-align:center;padding:60px 10px}.done b{font-size:44px;display:block}
</style>
</head>
<body>
<main id="app">
  <h1>Inga Master</h1>
  <p class="sub">Наращивание ресниц</p>
  <div id="body">Загрузка… (версия 5, скрипт не запущен)</div>
</main>
<div id="admv" hidden><div class="admw"><button class="back" id="admback">← Назад к записи</button><h1>Календарь мастера</h1><div id="acal"></div><div id="rs" hidden></div><div id="adet"></div></div></div>
<div class="bar" id="bar" hidden><div><div id="sum"></div><button id="go" disabled>Записаться</button></div></div>

<script>
// Telegram-скрипт грузим отдельно: если он долго грузится, приложение все равно стартует через 3 сек
function loadTG(cb){var done=false;function go(){if(!done){done=true;cb()}}var s=document.createElement("script");s.src="https://telegram.org/js/telegram-web-app.js";s.onload=go;s.onerror=go;(document.head||document.documentElement).appendChild(s);setTimeout(go,3000)}
document.getElementById("body").innerHTML='<p class="sub">Скрипт запущен… (версия 5)</p>';
loadTG(function(){
// Вставьте сюда ссылку на веб-приложение Apps Script (заканчивается на /exec)
var API = "https://script.google.com/macros/s/AKfycbyCfrOZpNavhpzHPVt940C0Er6qHk2j-MRtEIrRapWOaRAJheYRtcMkaBovM71TOZmq/exec";

var tg = window.Telegram && Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
function hap(){ try { tg.HapticFeedback.selectionChanged(); } catch (e) {} }

var D = null, sel = {}, date = null, time = null;
var $ = function (id) { return document.getElementById(id); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

window.onerror = function (m, s, l) { var b = document.getElementById("body"); if (b) b.innerHTML = '<p style="color:#c0392b">Ошибка в приложении: ' + String(m) + ' (строка ' + l + ')</p>'; };
function withTimeout(p, ms) { return Promise.race([p, new Promise(function (_, rej) { setTimeout(function () { rej(new Error("нет ответа от сервера за " + (ms / 1000) + " сек")); }, ms); })]); }
$("body").innerHTML = '<p class="sub">Соединяюсь с сервером… (версия 5)</p>';
withTimeout(fetch(API), 15000).then(function (r) { return r.text(); }).then(function (t) {
  var d; try { d = JSON.parse(t); } catch (e) { throw new Error("сервер вернул не данные: " + t.slice(0, 150)); }
  if (!d || !d.services) throw new Error("пустой ответ: " + t.slice(0, 150));
  D = d; build();
}).catch(function (e) { $("body").innerHTML = '<p style="color:#c0392b">Не удалось загрузить: ' + esc(e.message) + '</p>'; });

function dayLabel(s) {
  var a = s.split("/"), y = +a[2]; if (y < 100) y += 2000;
  var dt = new Date(y, +a[1] - 1, +a[0]);
  return isNaN(dt) ? s : dt.toLocaleDateString("ru", { weekday: "short", day: "numeric", month: "short" });
}

function build() {
  var h = '<button id="adm" class="adm" hidden>📅 Календарь мастера</button><div id="mine"></div><h2>Выберите услуги</h2>';
  D.services.forEach(function (s, i) {
    h += '<div class="svc" data-i="' + i + '"><div class="box">✓</div><div class="n">' + esc(s.n) + '</div><div class="p">' + esc(s.p) + '</div></div>';
  });
  h += '<h2>Дата</h2><div id="cal"></div><div id="tw" hidden><h2>Время</h2><div class="chips" id="times"></div></div>';
  h += '<h2>Ваши данные</h2><input id="nm" placeholder="Имя" autocomplete="name"><input id="ph" type="tel" placeholder="Телефон" autocomplete="tel"><div id="err"></div>';
  $("body").innerHTML = h;
  $("bar").hidden = false;
  drawCal();
  var u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (u && u.first_name) $("nm").value = u.first_name;

  $("body").onclick = function (e) {
    var nv = e.target.closest("[data-nav]");
    if (nv) { if (!nv.disabled) { CM.m += +nv.getAttribute("data-nav"); if (CM.m < 0) { CM.m = 11; CM.y--; } if (CM.m > 11) { CM.m = 0; CM.y++; } drawCal(); } return; }
    var cb = e.target.closest("[data-c]");
    if (cb) { cancelBooking(+cb.getAttribute("data-c")); return; }
    var s = e.target.closest(".svc"), d = e.target.closest("[data-d]"), t = e.target.closest("[data-t]");
    if (s) { var i = s.getAttribute("data-i"); if (sel[i]) delete sel[i]; else sel[i] = 1; s.classList.toggle("on"); hap(); }
    if (d) {
      var day = D.days[+d.getAttribute("data-d")]; date = day.d; time = null; drawCal();
      $("times").innerHTML = day.t.map(function (x) { return '<button class="chip" data-t="' + esc(x) + '">' + esc(x) + '</button>'; }).join("");
      $("tw").hidden = false; hap();
      try { $("tw").scrollIntoView({ behavior: "smooth", block: "nearest" }); } catch (e) {}
    }
    if (t) {
      document.querySelectorAll("#times .chip").forEach(function (c) { c.classList.remove("on"); });
      t.classList.add("on"); time = t.getAttribute("data-t"); hap();
    }
    upd();
  };
  $("nm").oninput = $("ph").oninput = upd;
  $("go").onclick = send;
  upd();
  loadMine();
}

var MY = [];
function post(o) {
  o.initData = tg ? tg.initData : "";
  return fetch(API, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(o) }).then(function (r) { return r.json(); });
}
function loadMine() {
  if (!tg || !tg.initData) return;
  post({ action: "my" }).then(function (r) {
    if (r && r.master) { $("adm").hidden = false; $("adm").onclick = openAdmin; }
    if (!r.ok || !r.list.length) { $("mine").innerHTML = ""; return; }
    MY = r.list;
    $("mine").innerHTML = "<h2>Ваши записи</h2>" + MY.map(function (b, i) {
      return '<div class="my"><div class="n">' + esc(dayLabel(b.d)) + ", " + esc(b.t) + "<small>" + esc(b.s) + '</small></div><button class="chip" data-c="' + i + '">Отменить</button></div>';
    }).join("");
  }).catch(function () {});
}
function cancelBooking(i) {
  var b = MY[i];
  if (!b || !confirm("Отменить запись на " + dayLabel(b.d) + ", " + b.t + "?")) return;
  post({ action: "cancel", date: b.d, time: b.t }).then(function (r) {
    if (r.ok) location.reload(); else alert(r.error || "Ошибка");
  }).catch(function () { alert("Нет связи"); });
}

var CM = null, MN = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
function p2(n) { return ("0" + n).slice(-2); }
function pd(s) { var a = s.split("/"), y = +a[2]; if (y < 100) y += 2000; return new Date(y, +a[1] - 1, +a[0]); }
function drawCal() {
  var el = $("cal");
  if (!D.days.length) { el.textContent = "Свободных окон пока нет."; return; }
  var idx = {}; D.days.forEach(function (d, i) { idx[d.d] = i; });
  var a = pd(D.days[0].d), b = pd(D.days[D.days.length - 1].d), now = new Date();
  if (!CM) CM = { y: a.getFullYear(), m: a.getMonth() };
  var y = CM.y, m = CM.m, off = (new Date(y, m, 1).getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate();
  var cur = y * 12 + m, tk = p2(now.getDate()) + "/" + p2(now.getMonth() + 1) + "/" + p2(now.getFullYear() % 100);
  var h = '<div class="cal"><div class="ch"><button class="nav" data-nav="-1"' + (cur > a.getFullYear() * 12 + a.getMonth() ? "" : " disabled") + '>‹</button><b>' + MN[m] + " " + y + '</b><button class="nav" data-nav="1"' + (cur < b.getFullYear() * 12 + b.getMonth() ? "" : " disabled") + '>›</button></div><div class="cg">';
  ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].forEach(function (w) { h += "<i>" + w + "</i>"; });
  for (var i = 0; i < off; i++) h += "<span></span>";
  for (var k = 1; k <= n; k++) {
    var key = p2(k) + "/" + p2(m + 1) + "/" + p2(y % 100), j = idx[key], t = key === tk ? " today" : "";
    h += j === undefined ? '<span class="day off' + t + '">' + k + "</span>"
      : '<button class="day' + (date === key ? " on" : "") + t + '" data-d="' + j + '">' + k + "</button>";
  }
  el.innerHTML = h + "</div></div>";
}

var AD = {}, AC = null, adate = null;
function kk(d) { return p2(d.getDate()) + "/" + p2(d.getMonth() + 1) + "/" + p2(d.getFullYear() % 100); }
function drawACal() {
  var now = new Date();
  if (!AC) AC = { y: now.getFullYear(), m: now.getMonth() };
  var y = AC.y, m = AC.m, off = (new Date(y, m, 1).getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate(), tk = kk(now);
  var h = '<div class="cal"><div class="ch"><button class="nav" data-anav="-1">‹</button><b>' + MN[m] + " " + y + '</b><button class="nav" data-anav="1">›</button></div><div class="cg">';
  ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].forEach(function (w) { h += "<i>" + w + "</i>"; });
  for (var i = 0; i < off; i++) h += "<span></span>";
  for (var k = 1; k <= n; k++) {
    var key = p2(k) + "/" + p2(m + 1) + "/" + p2(y % 100), it = AD[key] || [];
    var booked = it.some(function (x) { return !x.free; });
    h += '<button class="ad' + (it.length ? " has" : "") + (booked ? " bk" : "") + (adate === key ? " on" : "") + (key === tk ? " today" : "") + '" data-ad="' + key + '">' + k + "</button>";
  }
  $("acal").innerHTML = h + "</div></div>";
}
function showDay(k) {
  adate = k; drawACal();
  var it = AD[k] || [];
  $("adet").innerHTML = "<h2>" + esc(dayLabel(k)) + "</h2>" + (it.length ? it.map(function (x) {
    var T = esc(x.t);
    if (x.free) return '<div class="my"><div class="n">' + T + '<small class="' + (x.closed ? "" : "fr") + '">' + (x.closed ? "Закрыто" : "Свободно") + '</small></div><div style="display:grid;gap:6px">' + (x.closed ? "" : '<button class="chip" data-bk="' + T + '">Записать</button>') + '<button class="chip" data-' + (x.closed ? "op" : "cl") + '="' + T + '">' + (x.closed ? "Открыть" : "Закрыть") + "</button></div></div>";
    return '<div class="my"><div class="n">' + T + " · " + esc(x.n) + '<small><a href="tel:' + esc(x.p) + '">' + esc(x.p) + "</a><br>" + esc(x.s) + '</small></div><div style="display:grid;gap:6px"><button class="chip" data-mv="' + T + '">Перенести</button><button class="chip" data-mc="' + T + '">Отменить</button></div></div>';
  }).join("") : '<p class="sub">На этот день нет записей и свободного времени.</p>') + '<div style="display:grid;gap:8px;margin-top:10px"><button class="adm" style="margin:0" data-addw="1">＋ Добавить окно</button><button class="adm" style="margin:0" data-bk="*">＋ Записать клиента</button></div>';
}
function openAdmin() {
  $("admv").hidden = false; $("adet").textContent = "Загрузка…"; $("acal").innerHTML = "";
  post({ action: "admin" }).then(function (r) {
    if (!r.ok) { $("adet").textContent = r.error || "Ошибка"; return; }
    AD = r.days; AC = null; adate = null; drawACal();
    var t = kk(new Date());
    if (AD[t]) showDay(t); else $("adet").innerHTML = '<p class="sub">Выберите дату в календаре.</p>';
  }).catch(function () { $("adet").textContent = "Нет связи"; });
}
$("admback").onclick = function () { $("admv").hidden = true; };
var RS = null;
function openMove(t) {
  var x = (AD[adate] || []).filter(function (i) { return !i.free && i.t === t; })[0];
  if (!x) return;
  RS = { d: adate, t: t, nd: "", nt: "", man: false };
  var n = new Date(), mn = n.getFullYear() + "-" + p2(n.getMonth() + 1) + "-" + p2(n.getDate());
  $("rs").hidden = false;
  $("rs").innerHTML = '<div class="cal"><b>Перенос записи</b><p class="sub" style="margin:4px 0 10px">' + esc(x.n) + " · " + esc(dayLabel(adate)) + ", " + esc(t) + '</p><input type="date" id="rd" min="' + mn + '"><div id="rsl"></div><div class="rbtns"><button class="no" id="rcl">Отмена</button><button class="go2" id="rgo" disabled>Перенести</button></div></div>';
  $("rd").onchange = rDate; $("rcl").onclick = closeMove; $("rgo").onclick = doMove;
  try { $("rs").scrollIntoView({ behavior: "smooth", block: "nearest" }); } catch (e) {}
}
function closeMove() { RS = null; $("rs").hidden = true; $("rs").innerHTML = ""; }
function chk() { $("rgo").disabled = !(RS && RS.nd && /^\d{2}:\d{2}$/.test(RS.nt)); }
function manInput() {
  if ($("rm")) return;
  var i = document.createElement("input"); i.type = "time"; i.id = "rm";
  i.oninput = function () { RS.nt = this.value; chk(); };
  $("rsl").appendChild(i);
}
function rDate() {
  var v = $("rd").value; RS.nt = ""; RS.man = false;
  if (!v) { RS.nd = ""; $("rsl").innerHTML = ""; chk(); return; }
  var a = v.split("-"); RS.nd = a[2] + "/" + a[1] + "/" + a[0].slice(-2);
  var free = (AD[RS.nd] || []).filter(function (i) { return i.free && !i.closed; });
  if (free.length) {
    $("rsl").innerHTML = '<h2>Свободное время</h2><div class="chips">' + free.map(function (i) { return '<button class="chip" data-rt="' + esc(i.t) + '">' + esc(i.t) + "</button>"; }).join("") + '<button class="chip" data-rt="*">＋ Другое</button></div>';
  } else {
    $("rsl").innerHTML = '<p class="sub">' + (AD[RS.nd] ? "На эту дату нет свободного времени." : "Этой даты нет в расписании.") + " Впишите время самостоятельно:</p>";
    RS.man = true; manInput();
  }
  chk();
}
function doMove() {
  if (!RS || !confirm("Перенести запись на " + dayLabel(RS.nd) + ", " + RS.nt + "? Клиент получит уведомление.")) return;
  var nd = RS.nd; $("rgo").disabled = true;
  post({ action: "move", date: RS.d, time: RS.t, nd: nd, nt: RS.nt }).then(function (r) {
    if (r.ok) { closeMove(); var p = pd(nd); AC = { y: p.getFullYear(), m: p.getMonth() }; adate = nd; refreshAdmin(); }
    else { alert(r.error || "Ошибка"); chk(); }
  }).catch(function () { alert("Нет связи"); chk(); });
}
$("rs").addEventListener("click", function (e) {
  var c = e.target.closest("[data-rt]"); if (!c || !RS) return;
  document.querySelectorAll("#rs [data-rt]").forEach(function (b) { b.classList.remove("on"); });
  c.classList.add("on");
  var v = c.getAttribute("data-rt");
  if (v === "*") { RS.nt = ""; RS.man = true; manInput(); }
  else { RS.nt = v; RS.man = false; if ($("rm")) $("rm").remove(); }
  chk();
});
var BK = null;
function bchk() {
  $("bgo").disabled = !(BK && $("bn").value.trim() && $("bp").value.replace(/\D/g, "").length >= 7 && Object.keys(BK.sel).length && (BK.t || /^\d{2}:\d{2}$/.test($("bt").value)));
}
function openBook(t) {
  closeMove();
  BK = { d: adate, t: t === "*" ? "" : t, sel: {} };
  var h = '<div class="cal"><b>Запись клиента</b><p class="sub" style="margin:4px 0 10px">' + esc(dayLabel(adate)) + (BK.t ? ", " + esc(BK.t) : "") + "</p>";
  if (!BK.t) h += '<input type="time" id="bt">';
  h += '<input id="bn" placeholder="Имя клиента"><input id="bp" type="tel" placeholder="Телефон"><h2>Услуги</h2><div class="chips">' +
    D.services.map(function (s, i) { return '<button class="chip" data-bs="' + i + '">' + esc(s.n) + "</button>"; }).join("") +
    '</div><div class="rbtns"><button class="no" id="bcl">Отмена</button><button class="go2" id="bgo" disabled>Записать</button></div></div>';
  $("rs").hidden = false; $("rs").innerHTML = h;
  $("bn").oninput = $("bp").oninput = bchk; if ($("bt")) $("bt").oninput = bchk;
  $("bcl").onclick = function () { BK = null; $("rs").hidden = true; $("rs").innerHTML = ""; };
  $("bgo").onclick = doBook;
  try { $("rs").scrollIntoView({ behavior: "smooth", block: "nearest" }); } catch (e) {}
}
function doBook() {
  var t = BK.t || $("bt").value, nm = $("bn").value.trim(), ph = $("bp").value.trim();
  var sv = Object.keys(BK.sel).map(function (i) { return D.services[i].n; });
  if (!confirm("Записать " + nm + " на " + dayLabel(BK.d) + ", " + t + "?")) return;
  $("bgo").disabled = true;
  post({ action: "mbook", date: BK.d, time: t, name: nm, phone: ph, services: sv }).then(function (r) {
    if (r.ok) { BK = null; $("rs").hidden = true; $("rs").innerHTML = ""; refreshAdmin(); }
    else { alert(r.error || "Ошибка"); bchk(); }
  }).catch(function () { alert("Нет связи"); bchk(); });
}
$("rs").addEventListener("click", function (e) {
  var c = e.target.closest("[data-bs]"); if (!c || !BK) return;
  var i = c.getAttribute("data-bs"); if (BK.sel[i]) delete BK.sel[i]; else BK.sel[i] = 1;
  c.classList.toggle("on"); bchk();
});
var AW = null;
function toIso(k) { var d = pd(k); return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); }
function awDraw() {
  AW.times.sort();
  $("ad_l").innerHTML = AW.times.map(function (t) { return '<button class="chip on" data-aw="' + t + '">' + t + " ✕</button>"; }).join("") || '<span class="sub">Добавьте время кнопкой ＋</span>';
  $("ad_go").disabled = !AW.times.length;
}
function awAdd(t) { if (/^\d{2}:\d{2}$/.test(t) && AW.times.indexOf(t) < 0) AW.times.push(t); }
function closeAdd() { AW = null; $("rs").hidden = true; $("rs").innerHTML = ""; }
function openAdd() {
  closeMove(); BK = null; AW = { times: [] };
  $("rs").hidden = false;
  $("rs").innerHTML = '<div class="cal"><b>Добавить свободные окна</b><input type="date" id="ad_d" value="' + toIso(adate) + '" min="' + toIso(kk(new Date())) + '" style="margin-top:8px"><div style="display:flex;gap:8px"><input type="time" id="ad_t" style="margin:0"><button class="go2" id="ad_plus" style="flex:0 0 52px;border:0;border-radius:10px;font-size:22px">＋</button></div><button class="no" id="ad_std" style="width:100%;border:0;border-radius:10px;padding:10px;margin-top:8px;font-weight:700">＋ Типовые: 10:00–20:00 (каждые 2 часа)</button><div id="ad_l" class="chips" style="margin-top:10px"></div><div class="rbtns"><button class="no" id="ad_cl">Отмена</button><button class="go2" id="ad_go" disabled>Сохранить</button></div></div>';
  $("ad_plus").onclick = function () { awAdd($("ad_t").value); $("ad_t").value = ""; awDraw(); };
  $("ad_std").onclick = function () { ["10:00", "12:00", "14:00", "16:00", "18:00", "20:00"].forEach(awAdd); awDraw(); };
  $("ad_cl").onclick = closeAdd; $("ad_go").onclick = saveAdd;
  awDraw();
  try { $("rs").scrollIntoView({ behavior: "smooth", block: "nearest" }); } catch (e) {}
}
function saveAdd() {
  var v = $("ad_d").value; if (!v) { alert("Выберите дату"); return; }
  var a = v.split("-"), key = a[2] + "/" + a[1] + "/" + a[0].slice(-2);
  $("ad_go").disabled = true;
  post({ action: "addslot", date: key, times: AW.times }).then(function (r) {
    if (!r.ok) { alert(r.error || "Ошибка"); awDraw(); return; }
    if (r.skipped) alert("Добавлено: " + r.added + ". Пропущено: " + r.skipped + " (уже есть, занято или в прошлом).");
    closeAdd(); var p = pd(key); AC = { y: p.getFullYear(), m: p.getMonth() }; adate = key; refreshAdmin();
  }).catch(function () { alert("Нет связи"); awDraw(); });
}
$("rs").addEventListener("click", function (e) {
  var c = e.target.closest("[data-aw]"); if (!c || !AW) return;
  AW.times.splice(AW.times.indexOf(c.getAttribute("data-aw")), 1); awDraw();
});
function refreshAdmin() {
  post({ action: "admin" }).then(function (r) { if (r.ok) { AD = r.days; drawACal(); if (adate) showDay(adate); } });
}
function adone(r) { if (r.ok) refreshAdmin(); else alert(r.error || "Ошибка"); }
$("admv").addEventListener("click", function (e) {
  var nv = e.target.closest("[data-anav]"), dd = e.target.closest("[data-ad]");
  var aw = e.target.closest("[data-addw]"), bk = e.target.closest("[data-bk]"), mv = e.target.closest("[data-mv]"), mc = e.target.closest("[data-mc]"), cl = e.target.closest("[data-cl]"), op = e.target.closest("[data-op]");
  if (nv && AC) { AC.m += +nv.getAttribute("data-anav"); if (AC.m < 0) { AC.m = 11; AC.y--; } if (AC.m > 11) { AC.m = 0; AC.y++; } drawACal(); }
  else if (aw) openAdd();
  else if (bk) openBook(bk.getAttribute("data-bk"));
  else if (mv) openMove(mv.getAttribute("data-mv"));
  else if (mc) {
    var t = mc.getAttribute("data-mc");
    if (confirm("Отменить запись на " + dayLabel(adate) + ", " + t + "? Клиент получит уведомление.")) post({ action: "mcancel", date: adate, time: t }).then(adone);
  }
  else if (cl || op) { var b = cl || op; post({ action: "close", date: adate, time: b.getAttribute(cl ? "data-cl" : "data-op"), on: !!cl }).then(adone); }
  else if (dd) showDay(dd.getAttribute("data-ad"));
});

function chosen() { return Object.keys(sel).map(function (i) { return D.services[i]; }); }
function upd() {
  var c = chosen(), sum = 0, from = false, pct = 1;
  c.forEach(function (s) {
    var p = s.p.trim(), m = p.match(/^\D*(\d+)\s*т$/), k = p.match(/(\d+)\s*%/);
    if (m) sum += +m[1];
    else if (k) pct *= +k[1] / 100;
    if (/^от/i.test(p)) from = true;
  });
  sum = Math.round(sum * pct);
  var tot = (sum === 0 && pct < 1) ? Math.round(pct * 100) + "% от стоимости услуги" : (from ? "от " : "") + sum.toLocaleString("ru") + " т";
  $("sum").textContent = c.length ? "Итого: " + tot + (date && time ? " · " + dayLabel(date) + ", " + time : "") : "Выберите услугу, дату и время";
  var ok = c.length && date && time && $("nm").value.trim() && $("ph").value.replace(/\D/g, "").length >= 7;
  $("go").disabled = !ok;
}

function send() {
  $("go").disabled = true; $("go").textContent = "Отправляем…"; $("err").textContent = "";
  fetch(API, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({
    initData: tg ? tg.initData : "", services: chosen().map(function (s) { return s.n; }),
    date: date, time: time, name: $("nm").value.trim(), phone: $("ph").value.trim() }) })
  .then(function (r) { return r.json(); }).then(function (r) {
    if (r.ok) {
      $("bar").hidden = true;
      $("body").innerHTML = '<div class="done"><b>✅</b><h2>Вы записаны</h2><p>' + esc(dayLabel(date)) + ', ' + esc(time) + '<br>Подтверждение придёт в чат с ботом.</p></div>';
      try { tg.HapticFeedback.notificationOccurred("success"); setTimeout(function () { tg.close(); }, 3000); } catch (e) {}
    } else { $("err").textContent = r.error || "Ошибка"; $("go").textContent = "Записаться"; $("go").disabled = false; }
  }).catch(function () { $("err").textContent = "Нет связи. Попробуйте ещё раз."; $("go").textContent = "Записаться"; $("go").disabled = false; });
}
});
</script>
</body>
