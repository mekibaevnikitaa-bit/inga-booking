<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Запись к мастеру</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#fbf1ec;--ink:#2b2622;--muted:#8a7d75;--green:#2f6650;--panel:#fff;--line:#ecd9d0;
padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:18px 14px 130px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:30px;margin:6px 0 2px;color:var(--green)}
.sub{color:var(--muted);margin:0 0 18px}
h2{font-size:15px;margin:22px 0 8px}
.svc{display:flex;align-items:center;gap:12px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.svc.on{border-color:var(--green);background:#eef6f1}
.svc .n{flex:1;font-weight:600;font-size:15px}.svc .p{color:var(--muted);font-size:14px;white-space:nowrap}
.my{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}.my .n{flex:1;font-weight:600;font-size:15px}.my small{display:block;color:var(--muted);font-weight:400;font-size:13px;margin-top:2px}
.box{width:22px;height:22px;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;color:#fff;font-size:14px}
.on .box{background:var(--green);border-color:var(--green)}
.cal{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:16px}
.nav{width:38px;height:38px;border:0;border-radius:10px;background:var(--bg);font-size:24px;color:var(--green)}.nav:disabled{opacity:.3}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cg i{font-style:normal;font-size:12px;color:var(--muted);padding:4px 0}
.day{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-size:15px;border:0;background:transparent;color:var(--muted);opacity:.35;padding:0}
button.day{opacity:1;background:#eef6f1;color:var(--green);font-weight:700}
button.day.on{background:var(--green);color:#fff}
.day.today{box-shadow:inset 0 0 0 1.5px var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 13px;font-size:14px;font-weight:600;color:var(--ink)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
input{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;margin-bottom:8px;background:var(--panel);color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.bar>div{max-width:520px;margin:0 auto}
#sum{font-size:13px;color:var(--muted);margin-bottom:6px;min-height:17px}
#go{width:100%;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:700;background:var(--green);color:#fff}
#go:disabled{background:#cdbfb7}
#err{color:#c0392b;font-size:14px;margin-top:8px}
.done{text-align:center;padding:60px 10px}.done b{font-size:44px;display:block}
</style>
</head>
<body>
<main id="app">
  <h1>Inga Master</h1>
  <p class="sub">Наращивание ресниц</p>
  <div id="body">Загрузка…</div>
</main>
<div class="bar" id="bar" hidden><div><div id="sum"></div><button id="go" disabled>Записаться</button></div></div>

<script>
// Вставьте сюда ссылку на веб-приложение Apps Script (заканчивается на /exec)
var API = "https://script.google.com/macros/s/AKfycbyCfrOZpNavhpzHPVt940C0Er6qHk2j-MRtEIrRapWOaRAJheYRtcMkaBovM71TOZmq/exec";

var tg = window.Telegram && Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
function hap(){ try { tg.HapticFeedback.selectionChanged(); } catch (e) {} }

var D = null, sel = {}, date = null, time = null;
var $ = function (id) { return document.getElementById(id); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

fetch(API).then(function (r) { return r.json(); }).then(function (d) { D = d; build(); })
  .catch(function () { $("body").textContent = "Не удалось загрузить данные. Попробуйте позже."; });

function dayLabel(s) {
  var a = s.split("/"), y = +a[2]; if (y < 100) y += 2000;
  var dt = new Date(y, +a[1] - 1, +a[0]);
  return isNaN(dt) ? s : dt.toLocaleDateString("ru", { weekday: "short", day: "numeric", month: "short" });
}

function build() {
  var h = '<div id="mine"></div><h2>Выберите услуги</h2>';
  D.services.forEach(function (s, i) {
    h += '<div class="svc" data-i="' + i + '"><div class="box">✓</div><div class="n">' + esc(s.n) + '</div><div class="p">' + esc(s.p) + '</div></div>';
  });
  h += '<h2>Дата</h2><div id="cal"></div><div id="tw" hidden><h2>Время</h2><div class="chips" id="times"></div></div>';
  h += '<h2>Ваши данные</h2><input id="nm" placeholder="Имя" autocomplete="name"><input id="ph" type="tel" placeholder="Телефон" autocomplete="tel"><div id="err"></div>';
  $("body").innerHTML = h;
  $("bar").hidden = false;
  drawCal();
  var u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (u && u.first_name) $("nm").value = u.first_name;

  $("body").onclick = function (e) {
    var nv = e.target.closest("[data-nav]");
    if (nv) { if (!nv.disabled) { CM.m += +nv.getAttribute("data-nav"); if (CM.m < 0) { CM.m = 11; CM.y--; } if (CM.m > 11) { CM.m = 0; CM.y++; } drawCal(); } return; }
    var cb = e.target.closest("[data-c]");
    if (cb) { cancelBooking(+cb.getAttribute("data-c")); return; }
    var s = e.target.closest(".svc"), d = e.target.closest("[data-d]"), t = e.target.closest("[data-t]");
    if (s) { var i = s.getAttribute("data-i"); if (sel[i]) delete sel[i]; else sel[i] = 1; s.classList.toggle("on"); hap(); }
    if (d) {
      var day = D.days[+d.getAttribute("data-d")]; date = day.d; time = null; drawCal();
      $("times").innerHTML = day.t.map(function (x) { return '<button class="chip" data-t="' + esc(x) + '">' + esc(x) + '</button>'; }).join("");
      $("tw").hidden = false; hap();
      try { $("tw").scrollIntoView({ behavior: "smooth", block: "nearest" }); } catch (e) {}
    }
    if (t) {
      document.querySelectorAll("#times .chip").forEach(function (c) { c.classList.remove("on"); });
      t.classList.add("on"); time = t.getAttribute("data-t"); hap();
    }
    upd();
  };
  $("nm").oninput = $("ph").oninput = upd;
  $("go").onclick = send;
  upd();
  loadMine();
}

var MY = [];
function post(o) {
  o.initData = tg ? tg.initData : "";
  return fetch(API, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(o) }).then(function (r) { return r.json(); });
}
function loadMine() {
  if (!tg || !tg.initData) return;
  post({ action: "my" }).then(function (r) {
    if (!r.ok || !r.list.length) { $("mine").innerHTML = ""; return; }
    MY = r.list;
    $("mine").innerHTML = "<h2>Ваши записи</h2>" + MY.map(function (b, i) {
      return '<div class="my"><div class="n">' + esc(dayLabel(b.d)) + ", " + esc(b.t) + "<small>" + esc(b.s) + '</small></div><button class="chip" data-c="' + i + '">Отменить</button></div>';
    }).join("");
  }).catch(function () {});
}
function cancelBooking(i) {
  var b = MY[i];
  if (!b || !confirm("Отменить запись на " + dayLabel(b.d) + ", " + b.t + "?")) return;
  post({ action: "cancel", date: b.d, time: b.t }).then(function (r) {
    if (r.ok) location.reload(); else alert(r.error || "Ошибка");
  }).catch(function () { alert("Нет связи"); });
}

var CM = null, MN = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
function p2(n) { return ("0" + n).slice(-2); }
function pd(s) { var a = s.split("/"), y = +a[2]; if (y < 100) y += 2000; return new Date(y, +a[1] - 1, +a[0]); }
function drawCal() {
  var el = $("cal");
  if (!D.days.length) { el.textContent = "Свободных окон пока нет."; return; }
  var idx = {}; D.days.forEach(function (d, i) { idx[d.d] = i; });
  var a = pd(D.days[0].d), b = pd(D.days[D.days.length - 1].d), now = new Date();
  if (!CM) CM = { y: a.getFullYear(), m: a.getMonth() };
  var y = CM.y, m = CM.m, off = (new Date(y, m, 1).getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate();
  var cur = y * 12 + m, tk = p2(now.getDate()) + "/" + p2(now.getMonth() + 1) + "/" + p2(now.getFullYear() % 100);
  var h = '<div class="cal"><div class="ch"><button class="nav" data-nav="-1"' + (cur > a.getFullYear() * 12 + a.getMonth() ? "" : " disabled") + '>‹</button><b>' + MN[m] + " " + y + '</b><button class="nav" data-nav="1"' + (cur < b.getFullYear() * 12 + b.getMonth() ? "" : " disabled") + '>›</button></div><div class="cg">';
  ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].forEach(function (w) { h += "<i>" + w + "</i>"; });
  for (var i = 0; i < off; i++) h += "<span></span>";
  for (var k = 1; k <= n; k++) {
    var key = p2(k) + "/" + p2(m + 1) + "/" + p2(y % 100), j = idx[key], t = key === tk ? " today" : "";
    h += j === undefined ? '<span class="day off' + t + '">' + k + "</span>"
      : '<button class="day' + (date === key ? " on" : "") + t + '" data-d="' + j + '">' + k + "</button>";
  }
  el.innerHTML = h + "</div></div>";
}

function chosen() { return Object.keys(sel).map(function (i) { return D.services[i]; }); }
function upd() {
  var c = chosen(), sum = 0, from = false, pct = 1;
  c.forEach(function (s) {
    var p = s.p.trim(), m = p.match(/^\D*(\d+)\s*т$/), k = p.match(/(\d+)\s*%/);
    if (m) sum += +m[1];
    else if (k) pct *= +k[1] / 100;
    if (/^от/i.test(p)) from = true;
  });
  sum = Math.round(sum * pct);
  var tot = (sum === 0 && pct < 1) ? Math.round(pct * 100) + "% от стоимости услуги" : (from ? "от " : "") + sum.toLocaleString("ru") + " т";
  $("sum").textContent = c.length ? "Итого: " + tot + (date && time ? " · " + dayLabel(date) + ", " + time : "") : "Выберите услугу, дату и время";
  var ok = c.length && date && time && $("nm").value.trim() && $("ph").value.replace(/\D/g, "").length >= 7;
  $("go").disabled = !ok;
}

function send() {
  $("go").disabled = true; $("go").textContent = "Отправляем…"; $("err").textContent = "";
  fetch(API, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({
    initData: tg ? tg.initData : "", services: chosen().map(function (s) { return s.n; }),
    date: date, time: time, name: $("nm").value.trim(), phone: $("ph").value.trim() }) })
  .then(function (r) { return r.json(); }).then(function (r) {
    if (r.ok) {
      $("bar").hidden = true;
      $("body").innerHTML = '<div class="done"><b>✅</b><h2>Вы записаны</h2><p>' + esc(dayLabel(date)) + ', ' + esc(time) + '<br>Подтверждение придёт в чат с ботом.</p></div>';
      try { tg.HapticFeedback.notificationOccurred("success"); setTimeout(function () { tg.close(); }, 3000); } catch (e) {}
    } else { $("err").textContent = r.error || "Ошибка"; $("go").textContent = "Записаться"; $("go").disabled = false; }
  }).catch(function () { $("err").textContent = "Нет связи. Попробуйте ещё раз."; $("go").textContent = "Записаться"; $("go").disabled = false; });
}
</script>
</body>
</html>
